<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10" height="5" viewBox="0 0 10 5">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="contain" background="#000000">
      <layer ref="base" states="*" static="true"/>
      <layer ref="dynamic" states="input">
        <enter duration-ms="100" easing="linear" from-opacity="0.25" from-translate-x="1"/>
      </layer>
    </scene>
  </metadata>
  <g id="base"><rect width="10" height="5" fill="#204060"/></g>
  <g id="dynamic"><rect x="2.25" y="1.25" width="4.5" height="2.5" fill="#ff8040"/></g>
</svg>
