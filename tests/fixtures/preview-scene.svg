<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5" height="1" viewBox="0 0 5 1">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="pixel" background="#000000">
      <layer ref="base" states="*" static="true"/>
      <layer ref="input-layer" states="input">
        <enter duration-ms="100" easing="linear" from-opacity="0"/>
        <exit duration-ms="100" easing="linear" to-opacity="0"/>
      </layer>
      <layer ref="verify-loop" states="verify">
        <timeline when="visible" duration-ms="1000" loop="true" easing="linear">
          <keyframe at="0" opacity="0"/>
          <keyframe at="0.5" opacity="1"/>
          <keyframe at="1" opacity="0"/>
        </timeline>
      </layer>
      <layer ref="fail-layer" states="fail">
        <enter duration-ms="100" easing="linear" from-opacity="0"/>
        <exit duration-ms="100" easing="linear" to-opacity="0"/>
      </layer>
      <layer ref="key-layer" trigger="key">
        <timeline duration-ms="100" restart="true" easing="linear">
          <keyframe at="0" opacity="0"/>
          <keyframe at="0.5" opacity="1"/>
          <keyframe at="1" opacity="0"/>
        </timeline>
      </layer>
      <layer ref="backspace-layer" trigger="backspace">
        <timeline duration-ms="100" restart="true" easing="linear">
          <keyframe at="0" opacity="0"/>
          <keyframe at="0.5" opacity="1"/>
          <keyframe at="1" opacity="0"/>
        </timeline>
      </layer>
    </scene>
  </metadata>
  <g id="base"><rect width="5" height="1" fill="#000000"/></g>
  <g id="input-layer"><rect x="0" y="0" width="1" height="1" fill="#00ff00"/></g>
  <g id="verify-loop"><rect x="1" y="0" width="1" height="1" fill="#ff0000"/></g>
  <g id="fail-layer"><rect x="2" y="0" width="1" height="1" fill="#ff0000"/></g>
  <g id="key-layer"><rect x="3" y="0" width="1" height="1" fill="#ff0000"/></g>
  <g id="backspace-layer"><rect x="4" y="0" width="1" height="1" fill="#0000ff"/></g>
</svg>
