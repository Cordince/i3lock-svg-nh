<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="1" viewBox="0 0 6 1">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="pixel" background="#000000">
      <layer ref="base" states="*" static="true"/>
      <layer ref="direct-hidden" states="*" static="true"/>
      <layer ref="style-hidden" states="*" static="true"/>
      <layer ref="css-hidden" states="*" static="true"/>
      <layer ref="ancestor-hidden" states="*" static="true"/>
      <layer ref="hidden-child" states="*" static="true"/>
      <layer ref="authored-opacity" states="*" static="true"/>
    </scene>
  </metadata>
  <style>
    #css-hidden { display: none !important; visibility: hidden !important; }
  </style>
  <g id="base"><rect width="6" height="1" fill="#000000"/></g>
  <g id="direct-hidden" display="none"><rect x="0" y="0" width="1" height="1" fill="#ff0000"/></g>
  <g id="style-hidden" style="display:none; visibility:hidden"><rect x="1" y="0" width="1" height="1" fill="#00ff00"/></g>
  <g id="css-hidden"><rect x="2" y="0" width="1" height="1" fill="#0000ff"/></g>
  <g id="hidden-ancestor" display="none">
    <g id="ancestor-hidden"><rect x="3" y="0" width="1" height="1" fill="#00ffff"/></g>
  </g>
  <g id="hidden-child">
    <rect x="4" y="0" width="1" height="1" fill="#ff00ff"/>
    <rect x="4" y="0" width="1" height="1" fill="#ffff00" display="none"/>
  </g>
  <g id="authored-opacity" opacity="0.4"><rect x="5" y="0" width="1" height="1" fill="#ff0000"/></g>
</svg>
