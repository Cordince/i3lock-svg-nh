<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2" height="1" viewBox="0 0 2 1">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="pixel" background="#000000">
      <layer ref="base" states="*" static="true"/>
      <layer ref="use-layer" states="*" static="true"/>
    </scene>
  </metadata>
  <defs>
    <linearGradient id="grad"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#ff0000"/></linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1" height="1"/></clipPath>
    <rect id="symbol-rect" x="1" y="0" width="1" height="1" fill="#00ff00"/>
  </defs>
  <g id="base"><rect x="0" y="0" width="1" height="1" fill="url(#grad)" clip-path="url(#clip)"/></g>
  <g id="use-layer"><use href="#symbol-rect"/></g>
</svg>
