<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="stretch" background="#020818">
      <layer ref="background" states="*" static="true" z="0"/>
      <layer ref="network" states="*" static="true" blend="screen" z="1"/>
      <layer ref="locked" states="locked" z="10">
        <enter duration-ms="360" easing="ease-out" from-opacity="0" from-scale="0.94"/>
        <exit duration-ms="180" easing="ease-in" to-opacity="0" to-scale="1.04"/>
      </layer>
      <layer ref="input" states="input" blend="screen" z="10">
        <enter duration-ms="240" easing="ease-out" from-opacity="0" from-scale="0.9"/>
        <exit duration-ms="160" easing="ease-in" to-opacity="0" to-scale="1.03"/>
      </layer>
      <layer ref="packet" trigger="key" blend="screen" z="20">
        <timeline duration-ms="520" restart="true" easing="ease-in-out">
          <keyframe at="0" opacity="0" translate-x="-520" scale="0.5"/>
          <keyframe at="0.15" opacity="1" translate-x="-360" scale="1"/>
          <keyframe at="0.8" opacity="1" translate-x="360" scale="1"/>
          <keyframe at="1" opacity="0" translate-x="520" scale="0.5"/>
        </timeline>
      </layer>
      <layer ref="packet-burst" trigger="key" blend="screen" z="21">
        <timeline duration-ms="420" restart="true" easing="ease-out">
          <keyframe at="0" opacity="0" scale="0.25"/>
          <keyframe at="0.2" opacity="0.9" scale="0.7"/>
          <keyframe at="1" opacity="0" scale="1.8"/>
        </timeline>
      </layer>
      <layer ref="reverse-packet" trigger="backspace" blend="difference" z="22">
        <timeline duration-ms="500" restart="true" easing="ease-in-out">
          <keyframe at="0" opacity="0" translate-x="520" scale="0.8"/>
          <keyframe at="0.18" opacity="1" translate-x="360" scale="1"/>
          <keyframe at="0.82" opacity="1" translate-x="-360" scale="1"/>
          <keyframe at="1" opacity="0" translate-x="-520" scale="0.7"/>
        </timeline>
      </layer>
      <layer ref="verify" states="verify" blend="screen" z="10">
        <enter duration-ms="260" easing="ease-out" from-opacity="0" from-scale="0.92"/>
        <exit duration-ms="180" easing="ease-in" to-opacity="0" to-scale="1.05"/>
      </layer>
      <layer ref="scan" states="verify" blend="screen" z="14">
        <timeline duration-ms="1300" loop="true" when="visible" easing="linear">
          <keyframe at="0" opacity="0.7" rotation-deg="0"/>
          <keyframe at="1" opacity="0.7" rotation-deg="360"/>
        </timeline>
      </layer>
      <layer ref="breath" states="verify" blend="screen" z="13">
        <timeline duration-ms="980" loop="true" when="visible" easing="ease-in-out">
          <keyframe at="0" opacity="0.2" scale="0.85"/>
          <keyframe at="0.5" opacity="0.72" scale="1.12"/>
          <keyframe at="1" opacity="0.2" scale="0.85"/>
        </timeline>
      </layer>
      <layer ref="fail-left" states="fail" blend="screen" z="20">
        <timeline duration-ms="680" when="visible" easing="ease-out">
          <keyframe at="0" opacity="0" translate-x="0"/>
          <keyframe at="0.18" opacity="1" translate-x="-18"/>
          <keyframe at="1" opacity="0.45" translate-x="-170"/>
        </timeline>
      </layer>
      <layer ref="fail-right" states="fail" blend="screen" z="20">
        <timeline duration-ms="680" when="visible" easing="ease-out">
          <keyframe at="0" opacity="0" translate-x="0"/>
          <keyframe at="0.18" opacity="1" translate-x="18"/>
          <keyframe at="1" opacity="0.45" translate-x="170"/>
        </timeline>
      </layer>
    </scene>
  </metadata>
  <title>Neural Constellation</title>
  <defs>

    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow20" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur35" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="35"/></filter>
    <linearGradient id="failRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffca72"/><stop offset="0.35" stop-color="#ff615c"/><stop offset="1" stop-color="#ff1748"/>
    </linearGradient>
    <radialGradient id="failGlow"><stop offset="0" stop-color="#ff6a55" stop-opacity="0.55"/><stop offset="1" stop-color="#ff1748" stop-opacity="0"/></radialGradient>


    <linearGradient id="nBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020818"/><stop offset="0.5" stop-color="#071126"/><stop offset="1" stop-color="#11051e"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3be5ff"/><stop offset="0.48" stop-color="#7b8cff"/><stop offset="1" stop-color="#e35dff"/></linearGradient>
    <radialGradient id="nodeGlow"><stop offset="0" stop-color="#79f7ff" stop-opacity="0.8"/><stop offset="1" stop-color="#7a5cff" stop-opacity="0"/></radialGradient>
    
  </defs>
  <g id="background" >
<rect width="1920" height="1080" fill="url(#nBg)"/><ellipse cx="960" cy="520" rx="780" ry="430" fill="#2547a0" opacity="0.06" filter="url(#blur35)"/>
  </g>
