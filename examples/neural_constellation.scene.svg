ity="0.46"/><circle cx="300" cy="590" r="8" fill="#75eaff" opacity="0.54"/><circle cx="470" cy="500" r="10" fill="#75eaff" opacity="0.62"/><circle cx="630" cy="650" r="6" fill="#75eaff" opacity="0.38"/><circle cx="800" cy="535" r="8" fill="#75eaff" opacity="0.46"/><circle cx="960" cy="680" r="10" fill="#75eaff" opacity="0.54"/><circle cx="1110" cy="530" r="6" fill="#75eaff" opacity="0.62"/><circle cx="1280" cy="650" r="8" fill="#75eaff" opacity="0.38"/><circle cx="1480" cy="525" r="10" fill="#75eaff" opacity="0.46"/><circle cx="1680" cy="630" r="6" fill="#75eaff" opacity="0.54"/></g>
  </g>
  <g id="locked" style="display:none" >
<g transform="translate(960 520)"><circle r="136" fill="#081326" stroke="url(#neon)" stroke-width="3" opacity="0.9"/><g fill="#5de8ff" opacity="0.65"><circle cx="0" cy="-68" r="10"/><circle cx="64" cy="-18" r="10"/><circle cx="38" cy="60" r="10"/><circle cx="-42" cy="56" r="10"/><circle cx="-66" cy="-20" r="10"/></g><path d="M0 -68 L64 -18 L38 60 L-42 56 L-66 -20 Z M0 -68 L38 60 M64 -18 L-42 56" fill="none" stroke="#79eaff" stroke-width="4" opacity="0.55"/></g>
  </g>
  <g id="input" style="display:none" >
<g transform="translate(960 520)"><circle r="152" fill="url(#nodeGlow)" opacity="0.24"/><circle r="144" fill="none" stroke="url(#neon)" stroke-width="11" stroke-dasharray="6 20" opacity="0.58"/><g fill="#c7fbff"><circle cx="0" cy="-76" r="12"/><circle cx="72" cy="-22" r="12"/><circle cx="42" cy="68" r="12"/><circle cx="-48" cy="64" r="12"/><circle cx="-76" cy="-22" r="12"/></g><path d="M0 -76 L72 -22 L42 68 L-48 64 L-76 -22 Z M0 -76 L42 68 M72 -22 L-48 64" fill="none" stroke="#92faff" stroke-width="5"/></g>
  </g>
