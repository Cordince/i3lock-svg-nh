  </g>
  <g id="fail-left" style="display:none" >
<g transform="translate(740 520)" fill="none" stroke="url(#failRed)" stroke-width="6"><path d="M-160 -120 L0 0 L-140 130 M-100 -160 L30 -20 L-70 160"/><g fill="#ff5a62" stroke="none"><circle cx="-160" cy="-120" r="14"/><circle cx="0" cy="0" r="14"/><circle cx="-140" cy="130" r="14"/></g></g>
  </g>
  <g id="fail-right" style="display:none" >
<g transform="translate(1180 520)" fill="none" stroke="url(#failRed)" stroke-width="6"><path d="M160 -120 L0 0 L140 130 M100 -160 L-30 -20 L70 160"/><g fill="#ff5a62" stroke="none"><circle cx="160" cy="-120" r="14"/><circle cx="0" cy="0" r="14"/><circle cx="140" cy="130" r="14"/></g></g>
