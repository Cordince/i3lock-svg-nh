<g transform="translate(960 520)"><path d="M-170 0 H170" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" filter="url(#glow4)"/><circle r="24" fill="#d8ffff"/><circle r="50" fill="url(#nodeGlow)" opacity="0.6"/></g>
  </g>
  <g id="packet-burst" style="display:none" >
<g transform="translate(960 520)"><circle r="82" fill="none" stroke="#8ff7ff" stroke-width="10"/><circle r="124" fill="none" stroke="#d06cff" stroke-width="4" stroke-dasharray="12 14"/></g>
  </g>
  <g id="reverse-packet" style="display:none" >
<g transform="translate(960 520)"><path d="M170 0 H-170" stroke="#ff7cf4" stroke-width="12" stroke-linecap="round" filter="url(#glow4)"/><circle r="22" fill="#fff"/></g>
  </g>
  <g id="verify" style="display:none" >
<g transform="translate(960 520)"><circle r="150" fill="#081326" opacity="0.95"/><circle r="146" fill="none" stroke="url(#neon)" stroke-width="3"/><g fill="#a8ffff"><circle cx="0" cy="-68" r="10"/><circle cx="64" cy="-18" r="10"/><circle cx="38" cy="60" r="10"/><circle cx="-42" cy="56" r="10"/><circle cx="-66" cy="-20" r="10"/></g></g>
  </g>
  <g id="scan" style="display:none" >
<g transform="translate(960 520)"><circle r="184" fill="none" stroke="url(#neon)" stroke-width="12" stroke-dasharray="82 26 18 38" stroke-linecap="round"/><path d="M0 0 L0 -206 A206 206 0 0 1 178 -103 Z" fill="#4fe6ff" opacity="0.08"/></g>
  </g>
