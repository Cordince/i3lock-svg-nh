      <stop offset="0.45" stop-color="#4de9ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4de9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="failGlow" cx="50%" cy="50%" r="50%">
