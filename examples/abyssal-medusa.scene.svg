    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3ffff"/>
      <stop offset="0.52" stop-color="#4de9ff"/>
      <stop offset="1" stop-color="#a764ff"/>
    </linearGradient>
    <linearGradient id="accentReverse" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ffff"/>
      <stop offset="0.48" stop-color="#a764ff"/>
      <stop offset="1" stop-color="#4de9ff"/>
    </linearGradient>
    <linearGradient id="failGrad" x1="0" y1="0" x2="1" y2="1">
