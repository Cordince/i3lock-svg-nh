      <circle cx="29" cy="26" r="1" fill="#fff" opacity="0.022"/>
      <path d="M0 31 L31 0" stroke="#fff" stroke-width="0.5" opacity="0.012"/>
    </pattern>
<linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020b19"/><stop offset=".6" stop-color="#031426"/><stop offset="1" stop-color="#02050c"/></linearGradient><radialGradient id="bell" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#a7ffff" stop-opacity=".62"/><stop offset=".45" stop-color="#36bedb" stop-opacity=".26"/><stop offset="1" stop-color="#4b3b96" stop-opacity=".05"/></radialGradient>
  </defs>
