<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Origami Aviary</title>
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="cover" background="#080a12">
      <layer ref="origami-background" states="*" static="true" z="0"/>
      <layer ref="origami-static" states="*" static="true" blend="multiply" z="1"/>
      <layer ref="origami-locked" states="locked" z="10">
  <enter duration-ms="420" easing="ease-out" from-opacity="0" from-scale="0.88"/>
  <timeline duration-ms="5200" loop="true" easing="ease-in-out" when="visible">
    <keyframe at="0" opacity="0.78" translate-y="-8" rotation-deg="-2"/>
    <keyframe at="0.5" opacity="1" translate-y="8" rotation-deg="2"/>
    <keyframe at="1" opacity="0.78" translate-y="-8" rotation-deg="-2"/>
  </timeline>
</layer>
      <layer ref="origami-input" states="input" blend="screen" z="20">
  <enter duration-ms="280" easing="ease-out" from-opacity="0" from-scale="0.82"/>
  <exit duration-ms="160" easing="ease-in" to-opacity="0" to-scale="1.08"/>
</layer>
      <layer ref="origami-key-wing" trigger="key" blend="screen" z="30">
  <timeline duration-ms="340" loop="false" easing="ease-out" restart="true">
    <keyframe at="0" opacity="0" scale="0.68" rotation-deg="-12"/>
    <keyframe at="0.18" opacity="1" scale="1.06" rotation-deg="6"/>
    <keyframe at="1" opacity="0" scale="1.24" rotation-deg="-4"/>
  </timeline>
</layer>
      <layer ref="origami-back-ribbon" trigger="backspace" blend="overlay" z="31">
  <timeline duration-ms="420" loop="false" easing="ease-out" restart="true">
    <keyframe at="0" opacity="0" translate-x="160" rotation-deg="4"/>
    <keyframe at="0.18" opacity="0.86" translate-x="0" rotation-deg="0"/>
    <keyframe at="1" opacity="0" translate-x="-280" rotation-deg="-8"/>
  </timeline>
</layer>
      <layer ref="origami-verify-flock" states="verify" blend="screen" z="28">
  <enter duration-ms="260" easing="ease-out" from-opacity="0" from-scale="0.78"/>
  <timeline duration-ms="5000" loop="true" easing="linear" when="visible">
    <keyframe at="0" opacity="0.72" rotation-deg="0" scale="0.94"/>
    <keyframe at="0.5" opacity="1" rotation-deg="180" scale="1.04"/>
    <keyframe at="1" opacity="0.72" rotation-deg="360" scale="0.94"/>
  </timeline>
</layer>
      <layer ref="origami-fail" states="fail" blend="screen" z="40">
