    <rect x="220" y="100" width="1480" height="880" rx="28" fill="#0c0d16" stroke="#393547" stroke-width="18"/>
    <rect x="275" y="150" width="1370" height="780" fill="#050812"/>
    <g stroke="#6c5d82" stroke-width="2" opacity=".26"><line x1="300" y1="150" x2="300" y2="930"/><line x1="338" y1="150" x2="338" y2="930"/><line x1="376" y1="150" x2="376" y2="930"/><line x1="414" y1="150" x2="414" y2="930"/><line x1="452" y1="150" x2="452" y2="930"/><line x1="490" y1="150" x2="490" y2="930"/><line x1="528" y1="150" x2="528" y2="930"/><line x1="566" y1="150" x2="566" y2="930"/><line x1="604" y1="150" x2="604" y2="930"/><line x1="642" y1="150" x2="642" y2="930"/><line x1="680" y1="150" x2="680" y2="930"/><line x1="718" y1="150" x2="718" y2="930"/><line x1="756" y1="150" x2="756" y2="930"/><line x1="794" y1="150" x2="794" y2="930"/><line x1="832" y1="150" x2="832" y2="930"/><line x1="870" y1="150" x2="870" y2="930"/><line x1="908" y1="150" x2="908" y2="930"/><line x1="946" y1="150" x2="946" y2="930"/><line x1="984" y1="150" x2="984" y2="930"/><line x1="1022" y1="150" x2="1022" y2="930"/><line x1="1060" y1="150" x2="1060" y2="930"/><line x1="1098" y1="150" x2="1098" y2="930"/><line x1="1136" y1="150" x2="1136" y2="930"/><line x1="1174" y1="150" x2="1174" y2="930"/><line x1="1212" y1="150" x2="1212" y2="930"/><line x1="1250" y1="150" x2="1250" y2="930"/><line x1="1288" y1="150" x2="1288" y2="930"/><line x1="1326" y1="150" x2="1326" y2="930"/><line x1="1364" y1="150" x2="1364" y2="930"/><line x1="1402" y1="150" x2="1402" y2="930"/><line x1="1440" y1="150" x2="1440" y2="930"/><line x1="1478" y1="150" x2="1478" y2="930"/><line x1="1516" y1="150" x2="1516" y2="930"/><line x1="1554" y1="150" x2="1554" y2="930"/><line x1="1592" y1="150" x2="1592" y2="930"/></g>
    <g stroke="#24354a" stroke-width="5" opacity=".4"><line x1="275" y1="280" x2="1645" y2="280"/><line x1="275" y1="520" x2="1645" y2="520"/><line x1="275" y1="760" x2="1645" y2="760"/></g>
    <rect width="1920" height="1080" fill="url(#grain)"/>
  </g>
  <g id="loom-static">
    <g opacity=".34" fill="none" stroke="url(#accent)" stroke-width="4"><path d="M300 360 C480 280 650 430 830 350 S1190 280 1380 360 S1510 430 1640 360"/><path d="M300 600 C500 520 670 680 860 590 S1230 520 1420 600 S1540 660 1640 610"/><path d="M300 820 C470 750 650 860 840 800 S1180 740 1390 820 S1530 860 1640 820"/></g>
  </g>
  <g id="loom-locked" style="display:none">
    <rect x="300" y="250" width="1340" height="600" fill="url(#glow)" opacity=".12" filter="url(#blur24)"/>
  </g>
  <g id="loom-input" style="display:none">
    <g fill="none" stroke="url(#accent)" stroke-width="6" opacity=".58"><path d="M300 360 C480 280 650 430 830 350 S1190 280 1380 360 S1510 430 1640 360"/><path d="M300 600 C500 520 670 680 860 590 S1230 520 1420 600 S1540 660 1640 610"/><path d="M300 820 C470 750 650 860 840 800 S1180 740 1390 820 S1530 860 1640 820"/></g>
  </g>
  <g id="loom-key-shuttle" style="display:none">
    <g transform="translate(960 540)" filter="url(#shadow)"><path d="M-120 0 L0 -54 L120 0 L0 54 Z" fill="url(#accent)"/><circle r="34" fill="#e6ffff" opacity=".82"/><path d="M-120 0 H-450" stroke="url(#accentReverse)" stroke-width="18" stroke-linecap="round" opacity=".42" filter="url(#blur4)"/></g>
  </g>
  <g id="loom-back-shuttle" style="display:none">
    <g transform="translate(960 540)"><path d="M-120 0 L0 -54 L120 0 L0 54 Z" fill="url(#accentReverse)"/><path d="M120 0 H450" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity=".42" filter="url(#blur4)"/></g>
  </g>
  <g id="loom-verify-band" style="display:none">
    <rect x="290" y="440" width="1360" height="180" rx="22" fill="url(#glow)" opacity=".32" filter="url(#blur10)"/>
    <g stroke="url(#accent)" stroke-width="8" opacity=".72"><line x1="320" y1="450" x2="370" y2="610"/><line x1="390" y1="450" x2="440" y2="610"/><line x1="460" y1="450" x2="510" y2="610"/><line x1="530" y1="450" x2="580" y2="610"/><line x1="600" y1="450" x2="650" y2="610"/><line x1="670" y1="450" x2="720" y2="610"/><line x1="740" y1="450" x2="790" y2="610"/><line x1="810" y1="450" x2="860" y2="610"/><line x1="880" y1="450" x2="930" y2="610"/><line x1="950" y1="450" x2="1000" y2="610"/><line x1="1020" y1="450" x2="1070" y2="610"/><line x1="1090" y1="450" x2="1140" y2="610"/><line x1="1160" y1="450" x2="1210" y2="610"/><line x1="1230" y1="450" x2="1280" y2="610"/><line x1="1300" y1="450" x2="1350" y2="610"/><line x1="1370" y1="450" x2="1420" y2="610"/><line x1="1440" y1="450" x2="1490" y2="610"/><line x1="1510" y1="450" x2="1560" y2="610"/></g>
  </g>
  <g id="loom-verify-nodes" style="display:none">
    <g fill="url(#accent)" opacity=".8"><circle cx="340" cy="515" r="10"/><circle cx="435" cy="565" r="10"/><circle cx="530" cy="515" r="10"/><circle cx="625" cy="565" r="10"/><circle cx="720" cy="515" r="10"/><circle cx="815" cy="565" r="10"/><circle cx="910" cy="515" r="10"/><circle cx="1005" cy="565" r="10"/><circle cx="1100" cy="515" r="10"/><circle cx="1195" cy="565" r="10"/><circle cx="1290" cy="515" r="10"/><circle cx="1385" cy="565" r="10"/><circle cx="1480" cy="515" r="10"/><circle cx="1575" cy="565" r="10"/></g>
  </g>
  <g id="loom-fail" style="display:none">
    <g stroke="url(#failGrad)" stroke-width="12" stroke-linecap="round" filter="url(#blur4)"><path d="M780 170 L820 380 L760 520 L830 710 L790 930"/><path d="M1110 170 L1070 340 L1140 500 L1080 680 L1130 930"/></g>
    <g fill="#ff5470" opacity=".65"><path d="M760 520 l-80 45 70 32z"/><path d="M1140 500 l90 -35 -80 100z"/><circle cx="830" cy="710" r="16"/><circle cx="1080" cy="680" r="14"/></g>
  </g>
</svg>
