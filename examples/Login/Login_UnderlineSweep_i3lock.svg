<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="login-underline-sweep-i3lock"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="red-glow" x="-0.35" y="-0.45" width="1.7" height="1.9">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset in="blur" dx="5" dy="7" result="offset" />
      <feFlood flood-color="#030303" flood-opacity="0.8" result="shadow-color" />
      <feComposite in="shadow-color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .letter {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: 0;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #d40000;
        stroke: #303030;
        stroke-width: 9px;
        stroke-linejoin: round;
        paint-order: stroke fill;
        filter: url(#red-glow);
      }
      .underline {
        fill: none;
        stroke: #d40000;
        stroke-width: 5px;
        stroke-linecap: round;
      }
      .scan {
        fill: #ff2f2f;
        opacity: 0.8;
      }
      .status {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 48px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #c8102e;
      }
    </style>
  </defs>

  <g id="bg" />
  <g id="sequential_animation" />
  <g id="remove_background" />

  <g id="anim00">
    <line class="underline" x1="810" y1="468" x2="866" y2="468" />
    <circle class="scan" cx="866" cy="468" r="8" />
    <text class="letter" x="834" y="390">L</text>
  </g>
  <g id="anim01">
    <line class="underline" x1="810" y1="468" x2="930" y2="468" />
