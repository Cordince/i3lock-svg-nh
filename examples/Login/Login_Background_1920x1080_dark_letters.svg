    <path class="fine-line" d="M 0,520 H 1920" />
    <path class="fine-line" d="M 0,800 H 1920" />
    <path class="fine-line" d="M 320,0 V 1080" />
    <path class="fine-line" d="M 640,0 V 1080" />
