<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="login-background"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a1d" />
      <stop offset="0.48" stop-color="#0b0d0f" />
      <stop offset="1" stop-color="#050606" />
    </linearGradient>
    <linearGradient id="red-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8102e" stop-opacity="0" />
      <stop offset="0.45" stop-color="#c8102e" stop-opacity="0.2" />
      <stop offset="1" stop-color="#c8102e" stop-opacity="0.42" />
    </linearGradient>
    <style>
