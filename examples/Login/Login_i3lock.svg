<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="login-i3lock"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="letter-shadow" x="-0.25" y="-0.35" width="1.5" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feOffset in="blur" dx="5" dy="6" result="offset" />
      <feFlood flood-color="#050505" flood-opacity="0.75" result="shadow-color" />
      <feComposite in="shadow-color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .login-word {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: 0;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .status {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #c8102e;
      }
      .indicator-line {
        fill: none;
        stroke: #d40000;
        stroke-width: 4px;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <g id="bg" />

  <g id="anim00">
    <text class="login-word" x="960" y="390"><tspan style="fill:#d40000;stroke:#303030;stroke-width:9px;stroke-linejoin:round;paint-order:stroke fill;filter:url(#letter-shadow)">L</tspan><tspan style="fill:none;stroke:none">OGIN</tspan></text>
  </g>
  <g id="anim01">
    <text class="login-word" x="960" y="390"><tspan style="fill:none;stroke:none">L</tspan><tspan style="fill:#d40000;stroke:#303030;stroke-width:9px;stroke-linejoin:round;paint-order:stroke fill;filter:url(#letter-shadow)">O</tspan><tspan style="fill:none;stroke:none">GIN</tspan></text>
  </g>
  <g id="anim02">
    <text class="login-word" x="960" y="390"><tspan style="fill:none;stroke:none">LO</tspan><tspan style="fill:#d40000;stroke:#303030;stroke-width:9px;stroke-linejoin:round;paint-order:stroke fill;filter:url(#letter-shadow)">G</tspan><tspan style="fill:none;stroke:none">IN</tspan></text>
  </g>
  <g id="anim03">
    <text class="login-word" x="960" y="390"><tspan style="fill:none;stroke:none">LOG</tspan><tspan style="fill:#d40000;stroke:#303030;stroke-width:9px;stroke-linejoin:round;paint-order:stroke fill;filter:url(#letter-shadow)">I</tspan><tspan style="fill:none;stroke:none">N</tspan></text>
  </g>
  <g id="anim04">
    <text class="login-word" x="960" y="390"><tspan style="fill:none;stroke:none">LOGI</tspan><tspan style="fill:#d40000;stroke:#303030;stroke-width:9px;stroke-linejoin:round;paint-order:stroke fill;filter:url(#letter-shadow)">N</tspan></text>
  </g>

  <g id="backspace">
    <line class="indicator-line" x1="812" y1="460" x2="1108" y2="460" />
  </g>

  <g id="verify">
    <text class="status" x="960" y="470">CHECKING</text>
  </g>

  <g id="fg" />

  <g id="idle">
    <line class="indicator-line" x1="812" y1="460" x2="1108" y2="460" />
    <line class="indicator-line" x1="812" y1="460" x2="832" y2="442" />
    <line class="indicator-line" x1="812" y1="460" x2="832" y2="478" />
  </g>

  <g id="fail">
    <text class="status" x="960" y="470">LOGIN FAILED</text>
  </g>
</svg>
