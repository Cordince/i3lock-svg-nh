<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="login-pulse-i3lock"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="red-glow" x="-0.45" y="-0.55" width="1.9" height="2.1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="soft-red" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset in="blur" dx="5" dy="7" result="offset" />
      <feFlood flood-color="#030303" flood-opacity="0.82" result="shadow-color" />
      <feComposite in="shadow-color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="soft-red" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .letter {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: 0;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #d40000;
        stroke: #303030;
        stroke-width: 9px;
        stroke-linejoin: round;
        paint-order: stroke fill;
        filter: url(#red-glow);
      }
      .underline {
        fill: none;
        stroke: #d40000;
        stroke-width: 5px;
        stroke-linecap: round;
      }
      .ring {
        fill: none;
        stroke: #ff3838;
        stroke-width: 4px;
        opacity: 0.42;
      }
      .status {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 48px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #c8102e;
      }
    </style>
  </defs>

  <g id="bg" />
  <g id="sequential_animation" />
  <g id="remove_background" />

  <g id="anim00">
    <line class="underline" x1="840" y1="468" x2="1080" y2="468" />
    <circle class="ring" cx="834" cy="390" r="52" />
    <g transform="translate(834 390) scale(1.22) translate(-834 -390)"><text class="letter" x="834" y="390">L</text></g>
  </g>
  <g id="anim01">
    <line class="underline" x1="820" y1="468" x2="1100" y2="468" />
    <circle class="ring" cx="906" cy="390" r="58" />
    <g transform="translate(906 390) scale(1.24) translate(-906 -390)"><text class="letter" x="906" y="390">O</text></g>
  </g>
  <g id="anim02">
    <line class="underline" x1="810" y1="468" x2="1110" y2="468" />
    <circle class="ring" cx="984" cy="390" r="62" />
    <g transform="translate(984 390) scale(1.26) translate(-984 -390)"><text class="letter" x="984" y="390">G</text></g>
  </g>
  <g id="anim03">
    <line class="underline" x1="820" y1="468" x2="1100" y2="468" />
    <circle class="ring" cx="1040" cy="390" r="50" />
    <g transform="translate(1040 390) scale(1.32) translate(-1040 -390)"><text class="letter" x="1040" y="390">I</text></g>
  </g>
  <g id="anim04">
    <line class="underline" x1="840" y1="468" x2="1080" y2="468" />
    <circle class="ring" cx="1092" cy="390" r="56" />
    <g transform="translate(1092 390) scale(1.24) translate(-1092 -390)"><text class="letter" x="1092" y="390">N</text></g>
  </g>
  <g id="anim05">
    <line class="underline" x1="810" y1="468" x2="1110" y2="468" />
    <text class="letter" x="834" y="390">L</text>
    <text class="letter" x="906" y="390">O</text>
    <text class="letter" x="984" y="390">G</text>
    <text class="letter" x="1040" y="390">I</text>
    <text class="letter" x="1092" y="390">N</text>
  </g>
  <g id="anim06">
    <line class="underline" x1="850" y1="468" x2="1070" y2="468" />
    <circle class="ring" cx="960" cy="390" r="86" />
    <g transform="translate(960 390) scale(0.86) translate(-960 -390)">
      <text class="letter" x="834" y="390">L</text>
      <text class="letter" x="906" y="390">O</text>
      <text class="letter" x="984" y="390">G</text>
      <text class="letter" x="1040" y="390">I</text>
      <text class="letter" x="1092" y="390">N</text>
    </g>
  </g>
  <g id="anim07">
    <line class="underline" x1="810" y1="468" x2="1110" y2="468" />
    <circle class="ring" cx="960" cy="390" r="110" />
    <g transform="translate(960 390) scale(1.08) translate(-960 -390)">
      <text class="letter" x="834" y="390">L</text>
      <text class="letter" x="906" y="390">O</text>
      <text class="letter" x="984" y="390">G</text>
      <text class="letter" x="1040" y="390">I</text>
      <text class="letter" x="1092" y="390">N</text>
    </g>
  </g>

  <g id="backspace">
    <line class="underline" x1="810" y1="468" x2="1110" y2="468" />
  </g>
  <g id="verify">
    <text class="status" x="960" y="515">CHECKING</text>
  </g>
  <g id="fg" />
  <g id="idle">
    <line class="underline" x1="810" y1="468" x2="1110" y2="468" />
  </g>
  <g id="fail">
    <text class="status" x="960" y="515">LOGIN FAILED</text>
  </g>
</svg>
