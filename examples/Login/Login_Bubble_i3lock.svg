<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="login-bubble-i3lock"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="red-glow" x="-0.35" y="-0.45" width="1.7" height="1.9">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset in="blur" dx="5" dy="7" result="offset" />
      <feFlood flood-color="#030303" flood-opacity="0.8" result="shadow-color" />
      <feComposite in="shadow-color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .letter {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: 0;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #d40000;
        stroke: #303030;
        stroke-width: 9px;
        stroke-linejoin: round;
        paint-order: stroke fill;
        filter: url(#red-glow);
      }
      .underline {
        fill: none;
        stroke: #d40000;
        stroke-width: 5px;
        stroke-linecap: round;
      }
      .bubble {
        fill: none;
        stroke: #ff3838;
        stroke-width: 3px;
        opacity: 0.58;
      }
      .bubble-fill {
        fill: #d40000;
        opacity: 0.18;
      }
      .status {
        font-family: 'Liberation Sans', Arial, sans-serif;
        font-size: 48px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #c8102e;
      }
    </style>
  </defs>

  <g id="bg" />
  <g id="sequential_animation" />
  <g id="remove_background" />

  <g id="anim00">
    <line class="underline" x1="810" y1="468" x2="1110" y2="468" />
    <text class="letter" x="834" y="390">L</text>
    <circle class="bubble" cx="828" cy="444" r="8" />
    <circle class="bubble-fill" cx="862" cy="456" r="5" />
  </g>
