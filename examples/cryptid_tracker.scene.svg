      <stop offset="0" stop-color="#ffca72"/><stop offset="0.35" stop-color="#ff615c"/><stop offset="1" stop-color="#ff1748"/>
    </linearGradient>
    <radialGradient id="failGlow"><stop offset="0" stop-color="#ff6a55" stop-opacity="0.55"/><stop offset="1" stop-color="#ff1748" stop-opacity="0"/></radialGradient>


    <linearGradient id="cryptBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091622"/><stop offset="0.52" stop-color="#07100f"/><stop offset="1" stop-color="#020302"/></linearGradient>
    <radialGradient id="cryptMoon"><stop offset="0" stop-color="#fff4c4"/><stop offset="0.7" stop-color="#a5c0c9"/><stop offset="1" stop-color="#49616b"/></radialGradient>
    <linearGradient id="mapInk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d3a2"/><stop offset="1" stop-color="#9e8659"/></linearGradient>
    <linearGradient id="scanGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8dffdc"/><stop offset="1" stop-color="#33b7c9"/></linearGradient>
    
  </defs>
