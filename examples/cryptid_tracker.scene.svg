<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="stretch" background="#020302">
      <layer ref="background" states="*" static="true" z="0"/>
      <layer ref="map" states="*" static="true" z="1"/>
      <layer ref="locked" states="locked" z="10">
        <enter duration-ms="420" easing="ease-out" from-opacity="0" from-scale="0.95"/>
        <exit duration-ms="220" easing="ease-in" to-opacity="0" to-scale="1.04"/>
      </layer>
      <layer ref="input" states="input" blend="screen" z="10">
        <enter duration-ms="280" easing="ease-out" from-opacity="0" from-scale="0.92"/>
        <exit duration-ms="180" easing="ease-in" to-opacity="0" to-scale="1.04"/>
      </layer>
      <layer ref="footprint" trigger="key" blend="screen" z="20">
        <timeline duration-ms="520" restart="true" easing="ease-out">
          <keyframe at="0" opacity="0" scale="0.55" rotation-deg="-12"/>
          <keyframe at="0.2" opacity="1" scale="0.92" rotation-deg="0"/>
          <keyframe at="1" opacity="0" scale="1.5" rotation-deg="10"/>
        </timeline>
      </layer>
      <layer ref="smear" trigger="backspace" blend="multiply" z="21">
        <timeline duration-ms="520" restart="true" easing="ease-out">
          <keyframe at="0" opacity="0" translate-x="120" scale="1"/>
          <keyframe at="0.18" opacity="0.75" translate-x="60" scale="1"/>
          <keyframe at="1" opacity="0" translate-x="-340" scale="1.2"/>
        </timeline>
      </layer>
      <layer ref="verify" states="verify" z="10">
        <enter duration-ms="240" easing="ease-out" from-opacity="0" from-scale="0.92"/>
        <exit duration-ms="180" easing="ease-in" to-opacity="0" to-scale="1.05"/>
      </layer>
      <layer ref="radar" states="verify" blend="screen" z="14">
        <timeline duration-ms="1700" loop="true" when="visible" easing="linear">
          <keyframe at="0" opacity="0.72" rotation-deg="0"/>
          <keyframe at="1" opacity="0.72" rotation-deg="360"/>
        </timeline>
      </layer>
      <layer ref="target" states="verify" blend="screen" z="13">
        <timeline duration-ms="1200" loop="true" when="visible" easing="ease-in-out">
          <keyframe at="0" opacity="0.18" scale="0.86"/>
          <keyframe at="0.5" opacity="0.7" scale="1.12"/>
          <keyframe at="1" opacity="0.18" scale="0.86"/>
        </timeline>
      </layer>
      <layer ref="fail" states="fail" blend="screen" z="20">
        <timeline duration-ms="740" when="visible" easing="ease-out">
          <keyframe at="0" opacity="0" translate-x="-80" rotation-deg="-10"/>
          <keyframe at="0.2" opacity="1" translate-x="0" rotation-deg="0"/>
          <keyframe at="1" opacity="0.7" translate-x="60" rotation-deg="6"/>
        </timeline>
      </layer>
    </scene>
  </metadata>
  <title>Cryptid Tracker</title>
  <defs>

    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
