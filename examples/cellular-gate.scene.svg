<radialGradient id="cellBody" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#3fe8e0" stop-opacity=".24"/><stop offset=".55" stop-color="#167aa0" stop-opacity=".16"/><stop offset="1" stop-color="#06121d" stop-opacity=".05"/></radialGradient>
