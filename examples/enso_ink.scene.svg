<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="stretch" background="#9f9278">
      <layer ref="background" states="*" static="true" z="0"/>
      <layer ref="painting" states="*" static="true" blend="multiply" z="1"/>
      <layer ref="locked" states="locked" blend="multiply" z="10">
        <enter duration-ms="520" easing="ease-out" from-opacity="0" from-scale="0.96"/>
        <exit duration-ms="260" easing="ease-in" to-opacity="0" to-scale="1.03"/>
      </layer>
      <layer ref="input" states="input" blend="multiply" z="10">
        <enter duration-ms="300" easing="ease-out" from-opacity="0" from-scale="0.93"/>
        <exit duration-ms="200" easing="ease-in" to-opacity="0" to-scale="1.04"/>
      </layer>
      <layer ref="splash" trigger="key" blend="multiply" z="20">
        <timeline duration-ms="520" restart="true" easing="ease-out">
          <keyframe at="0" opacity="0" scale="0.25" rotation-deg="-18"/>
          <keyframe at="0.18" opacity="1" scale="0.8" rotation-deg="0"/>
          <keyframe at="1" opacity="0" scale="1.8" rotation-deg="28"/>
        </timeline>
      </layer>
      <layer ref="wash" trigger="backspace" blend="screen" z="21">
        <timeline duration-ms="680" restart="true" easing="ease-in-out">
          <keyframe at="0" opacity="0" translate-x="-420" scale-x="0.4"/>
          <keyframe at="0.2" opacity="0.72" translate-x="-180" scale-x="0.8"/>
          <keyframe at="1" opacity="0" translate-x="420" scale-x="1.4"/>
        </timeline>
      </layer>
      <layer ref="verify" states="verify" blend="multiply" z="10">
        <enter duration-ms="280" easing="ease-out" from-opacity="0" from-scale="0.92"/>
        <exit duration-ms="180" easing="ease-in" to-opacity="0" to-scale="1.05"/>
      </layer>
      <layer ref="brush-ring" states="verify" blend="multiply" z="14">
        <timeline duration-ms="3200" loop="true" when="visible" easing="linear">
          <keyframe at="0" opacity="0.8" rotation-deg="0"/>
          <keyframe at="1" opacity="0.8" rotation-deg="360"/>
        </timeline>
      </layer>
      <layer ref="seal" states="verify" blend="multiply" z="15">
        <timeline duration-ms="1500" loop="true" when="visible" easing="ease-in-out">
          <keyframe at="0" opacity="0.25" scale="0.86"/>
          <keyframe at="0.5" opacity="0.8" scale="1.1"/>
          <keyframe at="1" opacity="0.25" scale="0.86"/>
        </timeline>
      </layer>
      <layer ref="fail" states="fail" blend="multiply" z="20">
        <timeline duration-ms="620" when="visible" easing="ease-out">
          <keyframe at="0" opacity="0" scale="1.8" rotation-deg="-10"/>
          <keyframe at="0.18" opacity="1" scale="1" rotation-deg="0"/>
          <keyframe at="1" opacity="0.76" scale="0.94" rotation-deg="3"/>
        </timeline>
      </layer>
    </scene>
  </metadata>
  <title>Ink Brush Enso</title>
  <defs>

    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow20" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur35" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="35"/></filter>
    <linearGradient id="failRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffca72"/><stop offset="0.35" stop-color="#ff615c"/><stop offset="1" stop-color="#ff1748"/>
    </linearGradient>
    <radialGradient id="failGlow"><stop offset="0" stop-color="#ff6a55" stop-opacity="0.55"/><stop offset="1" stop-color="#ff1748" stop-opacity="0"/></radialGradient>


    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dfc9"/><stop offset="0.55" stop-color="#cfc3a8"/><stop offset="1" stop-color="#9f9278"/></linearGradient>
    <radialGradient id="ink"><stop offset="0" stop-color="#1a1a17"/><stop offset="1" stop-color="#050504"/></radialGradient>
    <radialGradient id="wash"><stop offset="0" stop-color="#718f97" stop-opacity="0.42"/><stop offset="1" stop-color="#718f97" stop-opacity="0"/></radialGradient>
    
  </defs>
