<g transform="translate(920 520)"><circle r="236" fill="none" stroke="#10100e" stroke-width="62" stroke-dasharray="1210 220" stroke-linecap="round" transform="rotate(-22)"/><path d="M-82 24 Q0 -80 82 24 Q0 82 -82 24" fill="none" stroke="#080807" stroke-width="14"/><circle cx="210" cy="-96" r="20" fill="#151512"/></g>
