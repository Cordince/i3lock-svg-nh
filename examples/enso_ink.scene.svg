  <g id="painting" >
<g fill="#30322d" opacity="0.42"><path d="M0 780 Q300 570 540 740 T1050 720 T1500 680 T1920 760 V1080 H0 Z"/><path d="M0 820 Q300 710 620 820 T1260 780 T1920 850 V1080 H0 Z" opacity="0.55"/></g><g stroke="#302f29" fill="none" stroke-width="8" opacity="0.45"><path d="M1460 0 Q1420 200 1510 360 T1460 710"/><path d="M1480 190 Q1580 120 1690 170 M1500 300 Q1600 240 1740 290 M1490 410 Q1600 350 1760 420"/></g>
