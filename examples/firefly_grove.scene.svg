<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <metadata>
    <scene xmlns="urn:i3lock-svg-nh:scene:1" version="1" fit="stretch" background="#010504">
      <layer ref="background" states="*" static="true" z="0"/>
      <layer ref="forest" states="*" static="true" z="1"/>
      <layer ref="locked" states="locked" blend="screen" z="10">
        <enter duration-ms="500" easing="ease-out" from-opacity="0" from-scale="0.96"/>
        <exit duration-ms="260" easing="ease-in" to-opacity="0" to-scale="1.02"/>
      </layer>
      <layer ref="input" states="input" blend="screen" z="10">
        <enter duration-ms="320" easing="ease-out" from-opacity="0" from-scale="0.94"/>
        <exit duration-ms="200" easing="ease-in" to-opacity="0" to-scale="1.03"/>
      </layer>
      <layer ref="firefly-burst" trigger="key" blend="screen" z="20">
        <timeline duration-ms="600" restart="true" easing="ease-out">
          <keyframe at="0" opacity="0" scale="0.4" rotation-deg="-18"/>
          <keyframe at="0.18" opacity="1" scale="0.85" rotation-deg="0"/>
          <keyframe at="1" opacity="0" scale="1.75" rotation-deg="36"/>
        </timeline>
      </layer>
      <layer ref="wind" trigger="backspace" blend="screen" z="21">
        <timeline duration-ms="520" restart="true" easing="ease-out">
          <keyframe at="0" opacity="0" translate-x="180"/>
          <keyframe at="0.16" opacity="0.8" translate-x="80"/>
          <keyframe at="1" opacity="0" translate-x="-360"/>
        </timeline>
      </layer>
      <layer ref="verify" states="verify" blend="screen" z="10">
        <enter duration-ms="260" easing="ease-out" from-opacity="0" from-scale="0.94"/>
        <exit duration-ms="200" easing="ease-in" to-opacity="0" to-scale="1.04"/>
      </layer>
      <layer ref="swarm" states="verify" blend="screen" z="14">
        <timeline duration-ms="2600" loop="true" when="visible" easing="linear">
          <keyframe at="0" opacity="0.72" rotation-deg="0"/>
          <keyframe at="1" opacity="0.72" rotation-deg="360"/>
        </timeline>
      </layer>
      <layer ref="moon-breath" states="verify" blend="screen" z="13">
        <timeline duration-ms="1800" loop="true" when="visible" easing="ease-in-out">
          <keyframe at="0" opacity="0.18" scale="0.9"/>
          <keyframe at="0.5" opacity="0.6" scale="1.15"/>
          <keyframe at="1" opacity="0.18" scale="0.9"/>
        </timeline>
      </layer>
      <layer ref="fail" states="fail" z="10">
        <enter duration-ms="120" easing="ease-out" from-opacity="0"/>
        <exit duration-ms="420" easing="ease-in" to-opacity="0"/>
      </layer>
      <layer ref="falling-leaves" states="fail" blend="multiply" z="18">
        <timeline duration-ms="1100" when="visible" easing="ease-in">
          <keyframe at="0" opacity="0" translate-y="-140" rotation-deg="-12"/>
          <keyframe at="0.18" opacity="0.9" translate-y="-40" rotation-deg="0"/>
          <keyframe at="1" opacity="0" translate-y="260" rotation-deg="32"/>
        </timeline>
      </layer>
    </scene>
  </metadata>
  <title>Firefly Grove</title>
  <defs>

